name: Build installers

# Builds ClipRename Desktop from the PRIVATE source repo and publishes the
# installers as a Release here. The source never lands in this repository —
# it is checked out only on the ephemeral build runner, using a fine-grained
# PAT (secret PRIVATE_CLONE_TOKEN: Contents read-only on
# trysky1/cliprename-desktop). Running the builds HERE keeps them on public-repo
# runners, which are free and unmetered.
#
# Trigger from the Actions tab (Run workflow) with a release_tag like v0.1.13.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v0.1.13). Leave empty to just build.'
        required: false
        default: ''
      prerelease:
        description: 'Publish as a TEST build. GitHub hides prereleases from /releases/latest, so users on the stable channel never see it. Flip it to a real release later with: gh release edit <tag> --prerelease=false'
        required: false
        type: boolean
        default: false

# Needed to create releases and upload assets to them.
permissions:
  contents: write

jobs:
  # Publishing: create the (empty) release page first; each build job then
  # attaches its installers DIRECTLY to it. The tag is created on this repo's
  # default branch (the source-less landing page), so the release's automatic
  # "Source code" archives contain no application source.
  prepare-release:
    name: Create release page
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Create the release (installers attach as each build finishes)
        run: |
          cat > notes.md <<'MD'
          AI file sorting and renaming for video editors — the desktop companion to [cliprename.com](https://cliprename.com).

          ## Install

          | Your machine | Download |
          |---|---|
          | Windows PC | `ClipRename-<version>-setup.exe` |
          | Mac with Apple Silicon (M1/M2/M3/M4) | `ClipRename-<version>-arm64.dmg` |
          | Mac with Intel | `ClipRename-<version>-x64.dmg` |

          ## First-launch warnings (unsigned build)

          **Windows** — download the `.exe`, run it. If SmartScreen says
          "Windows protected your PC": click **More info → Run anyway**
          (the app isn't code-signed yet, so Windows can't verify the publisher).

          **macOS** — pick your chip: `arm64` for M1/M2/M3/M4 Macs,
          `x64` for older Intel Macs. Easiest install (no warnings at all):
          BEFORE opening the download, run in Terminal
          `xattr -d com.apple.quarantine ~/Downloads/ClipRename-*.dmg`,
          then open the `.dmg` and drag ClipRename to Applications — done.

          If you already installed and macOS claims the app *"is damaged"*
          (it isn't — it just isn't Apple-notarized yet): right-click
          **`Fix ClipRename.command`** in the `.dmg` → Open → Open — it now
          asks for your password if macOS blocks the first attempt. Manual
          alternative: `sudo xattr -cr /Applications/ClipRename.app`; if that
          says *"Operation not permitted"*, enable Terminal under System
          Settings → Privacy & Security → App Management and rerun it.
          MD
          # The heredoc above is quoted so the notes' backticks stay literal —
          # which also leaves "<version>" as-is. Substitute the real version now,
          # otherwise the download table names files that don't exist.
          sed -i "s/<version>/${TAG#v}/g" notes.md
          # A prerelease is invisible to the app's stable update check, which is
          # what makes it safe to test on real machines before anyone else gets
          # it. Passed on BOTH paths so re-running an existing tag as a test
          # build actually marks it as one.
          PRE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          # A NEW tag starts as a DRAFT: invisible to /releases/latest, the
          # in-app updater, and the website's download redirector until the
          # publish-release job at the end verifies every installer arrived
          # and flips it live. Without this the release is public for the
          # ~20 minutes the builds take, with zero-then-some assets — during
          # the v0.1.36 build the website truthfully reported Windows and
          # Intel downloads as unavailable, because at that moment they were.
          # Re-runs of an existing tag take the edit path, which leaves its
          # published state untouched: iterating on a live tag never hides
          # it, and a leftover draft from a failed run is reused rather than
          # duplicated (GitHub happily stores two drafts under one tag name,
          # and every later by-tag lookup would then be ambiguous).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" $PRE --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $PRE \
              --target "$GITHUB_SHA" --title "ClipRename $TAG" --notes-file notes.md
          fi

  build:
    name: ${{ matrix.label }}
    needs: [prepare-release]
    # Run even when prepare-release is skipped (plain builds, no release).
    if: always() && needs.prepare-release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (PC)
            script: build:win
          # macOS is built on its native runner so the bundled ffmpeg binary
          # (ffmpeg-static installs ONE arch per machine) always matches.
          - os: macos-14 # Apple Silicon (M1/M2/M3/M4)
            label: macOS (Apple Silicon)
            script: build:mac
          - os: macos-15-intel # Intel Macs (pre-2021)
            label: macOS (Intel)
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the private-source token exists
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_CLONE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing PRIVATE_CLONE_TOKEN secret — create a fine-grained PAT with Contents read-only on trysky1/cliprename-desktop and add it under this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The application source lives in the private repo; it exists only on
      # this ephemeral runner and is destroyed when the job ends.
      - uses: actions/checkout@v5
        with:
          repository: trysky1/cliprename-desktop
          ref: main
          token: ${{ secrets.PRIVATE_CLONE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      # The same suite that gates the source repo's CI; a release build is
      # the last place a regression should be able to slip through.
      - name: Unit tests
        run: npm test

      # ---- Apple signing + notarization (removes the "damaged" warning) ----
      # Inactive until the repo has the secrets. To turn on real signing (needs
      # an Apple Developer account, $99/yr), add repo secrets:
      # MAC_CERT_P12_BASE64 (Developer ID cert, base64), MAC_CERT_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — then every build
      # signs + notarizes automatically and macOS installs cleanly.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PW: ${{ secrets.MAC_CERT_PASSWORD }}
          AP_ID: ${{ secrets.APPLE_ID }}
          AP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          AP_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            {
              echo "CSC_LINK=$MAC_CERT"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PW"
              echo "APPLE_ID=$AP_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$AP_PW"
              echo "APPLE_TEAM_ID=$AP_TEAM"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            echo "Apple signing + notarization ENABLED."
          else
            # No cert: electron-builder ad-hoc signs the macOS app so it
            # launches after Gatekeeper is cleared (see the bundled fixer).
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing secrets — building unsigned."
          fi

      # ClipRename's Blackmagic RAW reader (native/braw-helper in the source
      # repo): a small C++ program that drives the decoder engine found on the
      # user's machine. Needs nothing from Blackmagic to build (docs/BRAW.md).
      # Never blocks the build: without it the app falls back to proxies and
      # sound for BRAW clips. Same step as the private repo's dev.yml.
      - name: Build the Blackmagic RAW reader
        continue-on-error: true
        run: node scripts/build-braw-helper.mjs

      - name: Build app + installer
        run: npm run ${{ matrix.script }}

      # Publishing: attach the installers straight to the release. The .yml +
      # .blockmap files are the in-app updater's feed — without them installed
      # apps can't see or download new versions.
      - name: Upload installers to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          # Each macOS job also publishes its feed under an arch-specific name.
          # Both jobs write a file CALLED latest-mac.yml that lists only their
          # own architecture, and --clobber below means whichever job finishes
          # last used to win — leaving one architecture's updater pointed at
          # the other's build. The merge-mac-feed job combines the two arch
          # files into the real latest-mac.yml after both builds are done.
          if [ "$RUNNER_OS" = "macOS" ] && [ -f release/latest-mac.yml ]; then
            arch=x64; [ "$(uname -m)" = "arm64" ] && arch=arm64
            cp release/latest-mac.yml "release/latest-mac-$arch.yml"
          fi
          # latest*.yml only — release/*.yml would also grab builder-debug.yml.
          # .zip is the macOS in-app updater's payload (dmg is for manual installs).
          files=(release/*.exe release/*.dmg release/*.zip release/latest*.yml release/*.blockmap)
          echo "Uploading: ${files[*]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  # electron-builder on each macOS runner writes a latest-mac.yml that lists
  # only the architecture it built, so after both uploads the release carries
  # whichever one landed last — and the other architecture's in-app updater
  # follows a feed pointing at the wrong build. This job waits for every
  # build, then combines the two arch feeds into one latest-mac.yml whose
  # files list carries both, which electron-updater filters by CPU at
  # update time.
  merge-mac-feed:
    name: Merge the macOS update feeds
    needs: [build]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Combine arm64 + x64 into one latest-mac.yml
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest-mac-arm64.yml' --pattern 'latest-mac-x64.yml'
          python3 -m pip install --quiet pyyaml 2>/dev/null || true
          python3 - <<'PY'
          import yaml
          arm = yaml.safe_load(open('latest-mac-arm64.yml'))
          x64 = yaml.safe_load(open('latest-mac-x64.yml'))
          # x64 stays the base so the legacy top-level path/sha512 fallback
          # (read by updaters too old to filter the files list by CPU) points
          # at the one build every Mac can run, Rosetta included.
          merged = dict(x64)
          seen = set()
          files = []
          for f in (x64.get('files') or []) + (arm.get('files') or []):
              if f['url'] in seen:
                  continue
              seen.add(f['url'])
              files.append(f)
          merged['files'] = files
          yaml.safe_dump(merged, open('latest-mac.yml', 'w'), sort_keys=False)
          PY
          echo '--- merged feed:'
          cat latest-mac.yml
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest-mac.yml

  # The other half of prepare-release's --draft. A release built for a new
  # tag stays invisible until this job has checked that the complete asset
  # set is present — three installers, the two macOS updater payloads, and
  # all four update feeds. If anything is missing, the job fails and the
  # draft stays hidden, so customers and the website keep resolving the
  # previous complete release rather than a half-uploaded one. On an
  # in-place rebuild of an already-published tag the flip is a no-op and
  # this becomes a pure completeness check.
  publish-release:
    name: Publish once complete
    needs: [build, merge-mac-feed]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify every installer arrived, then go live
        run: |
          VER="${TAG#v}"
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$assets"
          missing=0
          for want in \
            "ClipRename-$VER-setup.exe" \
            "ClipRename-$VER-arm64.dmg" \
            "ClipRename-$VER-x64.dmg" \
            "ClipRename-$VER-arm64.zip" \
            "ClipRename-$VER-x64.zip" \
            "latest.yml" \
            "latest-mac.yml" \
            "latest-mac-arm64.yml" \
            "latest-mac-x64.yml"; do
            if ! grep -qxF "$want" <<< "$assets"; then
              echo "::error::Release asset missing: $want (the draft stays unpublished)"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Release $TAG is live with a complete asset set."
